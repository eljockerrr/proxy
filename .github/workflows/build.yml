name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract zip file
      run: |
        unzip -o SocksVpn.zip -d .
        if [ -d "SocksVpn" ]; then
          cp -r SocksVpn/* . || true
        fi
        chmod +x gradlew || true

    - name: Configure Gradle Fixes
      run: |
        # 1. استبدال رقم الإصدار القديم في أي ملف إعدادات
        find . -type f \( -name "*.gradle.kts" -o -name "*.gradle" -o -name "libs.versions.toml" \) -exec sed -i 's/2024.10.01/1.7.4/g' {} +

        # 2. إضافة إعدادات لإجبار Gradle على تمرير التحذيرات واستخدام الذاكرة بشكل مستقر
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
        echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.warning.mode=all
        else
          gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.warning.mode=all
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: "**/build/outputs/apk/**/*.apk"
