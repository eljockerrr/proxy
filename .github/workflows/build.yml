name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract zip file
      run: |
        unzip -o SocksVpn.zip -d .
        if [ -d "SocksVpn" ]; then
          cp -r SocksVpn/* . || true
        fi
        chmod +x gradlew || true

    - name: Fix Compose Dependencies
      run: |
        # إصلاح الإصدار غير المتوفر واستبداله بإصدار متوافق ومجرب
        find . -type f \( -name "*.gradle.kts" -o -name "*.gradle" -o -name "libs.versions.toml" \) -exec sed -i 's/2024.10.01/2024.09.00/g' {} +
        find . -type f \( -name "*.gradle.kts" -o -name "*.gradle" \) -exec sed -i 's/androidx.compose:compose-bom:2024.09.00/androidx.compose:compose-bom:2024.09.00/g' {} +

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: "**/build/outputs/apk/**/*.apk"
